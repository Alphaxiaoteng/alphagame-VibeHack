        const totalSlides = 6;
        let currentSlide = 0;
        let excalidrawApi = null;

        const slideYCoords = [
            30,
            1010,
            1990,
            2970,
            3950,
            4930
        ];

        function scrollToSlide(index) {
            if (index < 0) index = 0;
            if (index >= totalSlides) index = totalSlides - 1;
            currentSlide = index;
            document.getElementById("page-num").innerText = String(currentSlide + 1).padStart(2, '0') + ' / ' + String(totalSlides).padStart(2, '0');
            
            if (excalidrawApi) {
                const targetY = slideYCoords[currentSlide];
                // 聚焦到指定幻灯片范围
                excalidrawApi.scrollToContent([
                    { id: 'slide_' + currentSlide, type: 'rectangle', x: 40, y: targetY, width: 1520, height: 860 }
                ], { fitToViewport: true, animate: true, duration: 400 });
            }
        }

        function nextSlide() {
            scrollToSlide(currentSlide + 1);
        }

        function prevSlide() {
            scrollToSlide(currentSlide - 1);
        }

        function App() {
            return React.createElement(
                "div",
                { style: { width: "100%", height: "100%" } },
                React.createElement(ExcalidrawLib.Excalidraw, {
                    initialData: initialData,
                    zenModeEnabled: true,
                    gridModeEnabled: false,
                    theme: "light",
                    viewModeEnabled: true,
                    excalidrawAPI: (api) => {
                        excalidrawApi = api;
                        setTimeout(() => scrollToSlide(0), 200);
                    }
                })
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("excalidraw-container"));
        root.render(React.createElement(App));

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "f" || e.key === "F") {
                toggleFullscreen();
            } else if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
                nextSlide();
            } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
                prevSlide();
            }
        });
